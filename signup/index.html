<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Gyanu Notes</title>
<meta name="description" content="Create a free Gyanu Notes account to download notes and past papers for Class 8-12.">
<link rel="canonical" href="https://nawarajgupta.com.np/signup/" />
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/utilities.css">

</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="/" class="brand">
      <img src="/assets/images/logo.jpeg" alt="Gyanu Notes logo" class="brand-mark">
      Gyanu Notes
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/notes/">Notes</a></li>
      <li><a href="/papers/">Papers</a></li><li><a href="/blog/">Blog</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div class="login-menu">
        <a href="/login/" class="btn btn-outline login-trigger">Login</a>
        <div class="login-panel"></div>
      </div>
      <button class="nav-toggle" aria-label="Open menu">☰</button>
    </div>
  </nav>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Free forever. Takes less than a minute.</p>

      <div class="form-message" id="form-message"></div>

      <form id="signup-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Your name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="class-level">Class</label>
          <select id="class-level" required>
            <option value="" disabled selected>Select your class</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
          <div class="field-hint">Use at least 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="signup-submit">Create account</button>
      </form>

      <div class="auth-divider">or</div>

      <button class="google-btn" id="google-signup">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <button class="facebook-btn" id="facebook-signup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.79V24C19.61 23.09 24 18.1 24 12.07z"/></svg>
        Continue with Facebook
      </button>

      <p class="auth-footer">Already have an account? <a href="/login/">Log in</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Gyanu Notes. All rights reserved.</span>
      <div class="legal-links">
        <a href="/privacy/">Privacy policy</a>
        <a href="/terms/">Terms</a>
        <a href="/disclaimer/">Disclaimer</a>
      </div>
    </div>
  </div>
</footer>

<script src="/assets/js/main.js"></script>
<script type="module" src="/assets/js/auth-state.js"></script>
<script type="module">
  import { auth, db } from "/assets/js/firebase-config.js";
  import {
    createUserWithEmailAndPassword,
    updateProfile,
    sendEmailVerification,
    GoogleAuthProvider,
    FacebookAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  async function redirectAfterLogin(user) {
    var profile = await getDoc(doc(db, 'users', user.uid));
    window.location.href = profile.data()?.admin === true ? '/admin/' : '/dashboard/';
  }

  var form = document.getElementById('signup-form');
  var submitBtn = document.getElementById('signup-submit');
  var googleBtn = document.getElementById('google-signup');
  var facebookBtn = document.getElementById('facebook-signup');
  var msg = document.getElementById('form-message');

  function showMessage(text, type) {
    msg.textContent = text;
    msg.className = 'form-message ' + type;
  }

  function friendlyError(err) {
    var code = err.code || '';
    if (code.indexOf('email-already-in-use') !== -1) {
      return "An account already exists with that email. Try logging in instead.";
    }
    if (code.indexOf('weak-password') !== -1) {
      return "Please choose a stronger password (at least 6 characters).";
    }
    if (code.indexOf('invalid-email') !== -1) {
      return "Enter a valid email address.";
    }
    return "Something went wrong. Please try again.";
  }

  function saveProfile(user, name, classLevel) {
    return setDoc(doc(db, "users", user.uid), {
      name: name || user.displayName || "",
      email: user.email,
      classLevel: classLevel || null,
      createdAt: new Date().toISOString()
    }, { merge: true });
  }

  onAuthStateChanged(auth, function (user) {
    if (user && !form.dataset.submitting) {
      redirectAfterLogin(user);
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var classLevel = document.getElementById('class-level').value;
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';
    form.dataset.submitting = 'true';

    createUserWithEmailAndPassword(auth, email, password)
      .then(function (cred) {
        return updateProfile(cred.user, { displayName: name })
          .then(function () { return sendEmailVerification(cred.user); })
          .then(function () { return saveProfile(cred.user, name, classLevel); })
          .then(function () { return cred.user; });
      })
      .then(function (user) {
        redirectAfterLogin(user);
      })
      .catch(function (err) {
        showMessage(friendlyError(err), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
        form.dataset.submitting = '';
      });
  });

  googleBtn.addEventListener('click', function () {
    var provider = new GoogleAuthProvider();
    form.dataset.submitting = 'true';
    signInWithPopup(auth, provider)
      .then(function (cred) {
        return saveProfile(cred.user, cred.user.displayName, null).then(function () { return cred.user; });
      })
      .then(function (user) {
        redirectAfterLogin(user);
      })
      .catch(function () {
        showMessage('Google sign-up was cancelled or failed. Please try again.', 'error');
        form.dataset.submitting = '';
      });
  });

  facebookBtn.addEventListener('click', function () {
    var provider = new FacebookAuthProvider();
    form.dataset.submitting = 'true';
    signInWithPopup(auth, provider)
      .then(function (cred) {
        return saveProfile(cred.user, cred.user.displayName, null).then(function () { return cred.user; });
      })
      .then(function (user) {
        redirectAfterLogin(user);
      })
      .catch(function (err) {
        form.dataset.submitting = '';
        if (err.code === 'auth/account-exists-with-different-credential') {
          showMessage('An account already exists with this email using a different sign-in method. Try logging in with that method instead.', 'error');
        } else {
          showMessage('Facebook sign-up was cancelled or failed. Please try again.', 'error');
        }
      });
  });
</script>
</body>
</html>
