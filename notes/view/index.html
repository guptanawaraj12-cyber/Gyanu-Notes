<body>

<header class="site-header">
  <nav class="navbar">
    <a href="/" class="brand">
      <img src="/assets/images/logo.jpeg" alt="Gyanu Notes logo" class="brand-mark">
      Gyanu Notes
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/notes/" class="active">Notes</a></li>
      <li><a href="/papers/">Papers</a></li><li><a href="/blog/">Blog</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div class="login-menu">
        <a href="/login/" class="btn btn-outline login-trigger">Login</a>
        <div class="login-panel"></div>
      </div>
      <button class="nav-toggle" aria-label="Open menu">☰</button>
    </div>
  </nav>
</header>

<main>
  <section style="padding: 40px 0 80px;">
    <div class="container">
      <div class="breadcrumb"><a href="/notes/">Notes</a> <span id="breadcrumb-trail"></span></div>
      <h1 id="note-heading" aria-busy="true"><span class="skeleton sk-heading" aria-hidden="true"></span></h1>

      <div id="viewer-holder" aria-busy="true"><div class="skeleton sk-viewer" aria-hidden="true"></div></div>

      <div class="viewer-actions">
        <div class="download-menu">
          <button class="btn btn-primary" id="download-btn" aria-haspopup="true" aria-expanded="false" aria-controls="download-panel">Download ▾</button>
          <div class="download-panel" id="download-panel">
            <button class="dl-item" id="dl-notes" type="button">Download notes (PDF)<small>Branded PDF of the written notes</small></button>
            <button class="dl-item" id="dl-handwritten" type="button" style="display:none;">Download handwritten notes<small>The handwritten version of this chapter</small></button>
          </div>
        </div>
        <button class="btn btn-outline" id="share-btn" type="button">Share</button>
                <button class="btn btn-outline" id="bookmark-btn" aria-pressed="false" style="display:none;">
          <span class="bm-star">☆</span> <span class="bm-label">Save</span>
        </button>
        <div class="feedback-widget" id="feedback-widget" style="display:none;">
          <p class="feedback-prompt">Was this helpful?</p>
          <div class="feedback-btns">
            <button class="btn btn-outline" id="fb-up" type="button" aria-pressed="false">👍 Helpful</button>
            <button class="btn btn-outline" id="fb-down" type="button" aria-pressed="false">👎 Not helpful</button>
          </div>
          <p class="feedback-thanks" style="display:none;">Thanks for the feedback!</p>
        </div>
      </div>

      <div class="login-gate" id="login-gate" style="display: none;">
        <p>Log in to download this file. Viewing the preview above is free for everyone.</p>
        <a href="/login/" class="btn btn-outline" id="login-gate-link">Log in</a>
      </div>
    </div>
  </section>
</main>
